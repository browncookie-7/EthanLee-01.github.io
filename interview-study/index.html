const STORAGE_KEY='interview-access:'+location.pathname;
function decode64(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));}
function extractKey(raw){raw=raw.trim();if(raw.includes('#key='))raw=raw.split('#key=')[1].split('&')[0];return raw;}
async function unlockStudy(raw){
 const key=extractKey(raw);
 if(!/^[A-Za-z0-9_-]{43}$/.test(key))throw Error('invalid key');
 const imported=await crypto.subtle.importKey('raw',decode64(key),{name:'AES-GCM'},false,['decrypt']);
 const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(NONCE)},imported,decode64(ENCRYPTED_DATA));
 const html=new TextDecoder().decode(bytes);
 try{sessionStorage.setItem(STORAGE_KEY,key);}catch(e){}
 const hash=location.hash.startsWith('#/')?location.hash:'#/home';
 history.replaceState(null,'',location.pathname+location.search+hash);
 // Replace the complete document contents. document.write from an async loader
 // can leave the loader DOM/CSS behind and distort the application's layout.
 const parsed=new DOMParser().parseFromString(html,'text/html');
 const appScripts=Array.from(parsed.querySelectorAll('script')).map(node=>({text:node.textContent,src:node.getAttribute('src')}));
 parsed.querySelectorAll('script').forEach(node=>node.remove());
 document.documentElement.lang=parsed.documentElement.lang||'ko';
 document.head.replaceChildren(...Array.from(parsed.head.childNodes,node=>document.importNode(node,true)));
 document.body.removeAttribute('style');
 document.body.className=parsed.body.className;
 document.body.replaceChildren(...Array.from(parsed.body.childNodes,node=>document.importNode(node,true)));
 for(const data of appScripts){
   const script=document.createElement('script');
   if(data.src){script.src=data.src;script.async=false;}else{script.textContent=data.text;}
   document.body.appendChild(script);
 }
}
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();try{await unlockStudy(document.getElementById('access-key').value);}catch(err){document.getElementById('status').textContent='열 수 없습니다. 처음 받은 전용 링크를 다시 사용해 주세요.';}});
(async()=>{let key=new URLSearchParams(location.hash.slice(1)).get('key');if(!key){try{key=sessionStorage.getItem(STORAGE_KEY);}catch(e){}}if(key){try{await unlockStudy(key);return;}catch(e){}}document.getElementById('status').textContent='전용 링크의 접근 키가 필요합니다. 받은 링크 전체를 붙여넣어 주세요.';document.getElementById('unlock').classList.remove('hide');})();
