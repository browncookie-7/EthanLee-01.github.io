const STORAGE_KEY='interview-access:'+location.pathname;
function decode64(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));}
function extractKey(raw){raw=raw.trim();if(raw.includes('#key='))raw=raw.split('#key=')[1].split('&')[0];return raw;}
async function unlockStudy(raw){
 const key=extractKey(raw);
 if(!/^[A-Za-z0-9_-]{43}$/.test(key))throw Error('invalid key');
 const imported=await crypto.subtle.importKey('raw',decode64(key),{name:'AES-GCM'},false,['decrypt']);
 const bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode64(NONCE)},imported,decode64(ENCRYPTED_DATA));
 const html=new TextDecoder().decode(bytes);
 try{sessionStorage.setItem(STORAGE_KEY,key);}catch(e){}
 const hash=location.hash.startsWith('#/')?location.hash:'#/home';
 history.replaceState(null,'',location.pathname+location.search+hash);
 document.open();document.write(html);document.close();
}
document.getElementById('unlock').addEventListener('submit',async e=>{e.preventDefault();try{await unlockStudy(document.getElementById('access-key').value);}catch(err){document.getElementById('status').textContent='열 수 없습니다. 처음 받은 전용 링크를 다시 사용해 주세요.';}});
